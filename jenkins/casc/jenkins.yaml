jenkins:
  systemMessage: "AttendX — Student Attendance Management System · CI/CD pipeline"
  numExecutors: 2
  mode: NORMAL
  scmCheckoutRetryCount: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin123"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: |
      pipelineJob('student-attendance-pipeline') {
        description('Build, test, containerize and deploy the Student Attendance Management System.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('file:///workspace/student-attendance-devops')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
