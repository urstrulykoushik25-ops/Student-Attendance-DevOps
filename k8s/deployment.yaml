apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-app
  namespace: student-attendance
  labels:
    app.kubernetes.io/name: attendance-app
    app.kubernetes.io/part-of: student-attendance
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: attendance-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attendance-app
        app.kubernetes.io/part-of: student-attendance
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: attendance-app
          image: student-attendance:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: attendance-config
          env:
            - name: DB_PATH
              value: /app/data/attendance.db
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: attendance-data
